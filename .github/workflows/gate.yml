name: gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly, 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CI: 'true'

jobs:
  gate:
    name: ${{ matrix.lane }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-TSO does not reorder store-store, so a missing barrier is a
          # no-op bug here: the code is wrong and every test passes. The ARM64
          # leg is not redundancy, it is the only leg that can see that class
          # of bug. See knowledge/decisions/d6-memory-model-and-arm64.md.
          - arch: x64
            runner: ubuntu-24.04
            lane: ${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'pull_request' && 'full' || 'fast') }}
          - arch: arm64
            runner: ubuntu-24.04-arm
            lane: ${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'pull_request' && 'full' || 'fast') }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored-sbe upstream check and the codegen-freshness check both
          # need real git state, not a shallow detached snapshot.
          fetch-depth: 0

      # Runners ship a newer SDK than global.json pins. Install the pinned one
      # explicitly rather than letting bootstrap apt-install it: faster, cached,
      # and it keeps CI on exactly the SDK a developer runs (TRAP-8).
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Maven Central rate-limits when both matrix legs fetch at once (HTTP 429).
      # Cache the jar so a green run does not depend on someone else's quota.
      - name: Cache the SBE generator jar
        uses: actions/cache@v4
        with:
          path: tools/sbe-csharp-gen/*.jar
          key: sbe-jar-${{ hashFiles('sbe-version.txt') }}

      - name: Bootstrap
        run: SUDO=sudo bash scripts/bootstrap.sh

      - name: Show what this lane will run
        run: scripts/ci/gate.sh ${{ matrix.lane }} --list

      - name: Gate
        run: scripts/ci/gate.sh ${{ matrix.lane }}
